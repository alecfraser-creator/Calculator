<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="display">
        0
    </div>

    <div class="buttons">
        <div class="row">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">÷</button>
        </div>

        <div class="row">
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">x</button>
        </div>
        
        <div class="row">
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">-</button>
        </div>
        
         <div class="row">
            <button class="clear">C</button>
            <button class="number">0</button>
            <button class="equals">=</button>
            <button class="operator">+</button>
        </div>
    

        
    </div>
    

    

    <script>
        let currentInput = "";
        let expression = ""
        let firstNumber = null
        let operator = null
        let secondNumber = null
        let result = null
        
        const display = document.querySelector(".display");
        
        function updateDisplay(value) {
            display.textContent = value;
        }


        function add (a, b) {
            return a + b
        };

        function substract (a, b) {
            return a - b
        };

        function multiply (a, b) {
            return a * b
        }

        function divide (a,b) {
            return a / b
        }

        
        function operate (firstNumber, operator, secondNumber) {
            if (operator === "+") {
                return add(firstNumber, secondNumber)
            }
            else if (operator === "-") {
                return substract(firstNumber, secondNumber)
            }
            else if (operator === "x") {
                return multiply(firstNumber, secondNumber)
            }
            else if (operator === "÷") {
                if (secondNumber != 0) {
                    return divide(firstNumber, secondNumber)
                }
                else return "Error"
            }
        }
    


        const numberButtons = document.querySelectorAll(".number");
        const operatorButtons = document.querySelectorAll(".operator");
        const equalsButton = document.querySelector(".equals")
        const clearButton = document.querySelector(".clear")

        
        function formatExpression(expression) {
            return expression.replace(/-?\d+\.?\d*/g, number => {
                const value = Number(number);
                return Number.isFinite(value)
                    ? String(Number(value.toPrecision(8)))
                    : number;
            });
        }

        function clearCalculator() {
            currentInput = "";
            expression = "";
            firstNumber = null;
            operator = null;
            secondNumber = null;
            result = null;
            updateDisplay("0");
        }

        numberButtons.forEach((button) => {
            button.addEventListener("click", () => {
                if (result != null) {
                    clearCalculator()
                }
                currentInput += button.textContent;
                expression += button.textContent
                updateDisplay(formatExpression(expression));;
            });
        });


        operatorButtons.forEach((button) => {
            button.addEventListener("click", () => {

                if (operator !== null && currentInput === "") {
                    operator = button.textContent;
                    expression = String(firstNumber) + operator;
                    updateDisplay(formatExpression(expression));
                    return;
                }

                if (firstNumber !== null && operator !== null && currentInput !== "") {
                    secondNumber = Number(currentInput);
                    result = operate(firstNumber, operator, secondNumber);

                if (result === "Error") {
                    updateDisplay("Error");
                    currentInput = "";
                    expression = "";
                    firstNumber = null;
                    operator = null;
                    secondNumber = null;
                    result = null;
                    return;
                }

                firstNumber = result;
                result = null;
                } 
                
                else {
                    firstNumber = Number(currentInput);
                    result = null;
                }

                operator = button.textContent;
                currentInput = "";
                expression = String(firstNumber) + operator;
                updateDisplay(formatExpression(expression));
            });
        });

        equalsButton.addEventListener("click", () => {
            if (firstNumber === null || operator === null || currentInput === "") {
                return;
            }
            
            secondNumber = Number(currentInput)
            result = operate(firstNumber, operator, secondNumber)
            if (result === "Error") {
                updateDisplay("Error");
                currentInput = "";
                expression = "";
                firstNumber = null;
                operator = null;
                secondNumber = null;
                result = null;
                return;
            }
            
            updateDisplay(Number(result.toPrecision(8)))
            
            firstNumber = result;
            currentInput = String(result);
            expression = String(result);
            operator = null; 
        })


        clearButton.addEventListener("click", clearCalculator) 
    

    </script>

</body>
</html>
